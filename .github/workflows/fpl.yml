name: FPL-rapport
on:
  schedule:
    - cron: "17 7,16 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rapport:
    runs-on: ubuntu-latest
    env:
      NTFY_PAL: ${{ secrets.NTFY_PAL }}
      NTFY_SUSANNE: ${{ secrets.NTFY_SUSANNE }}
    steps:
      - uses: actions/checkout@v4
      - name: Lag rapport
        run: python3 fpl_bytter.py --out-dir docs/3d4db7b6ec03 ${{ github.event_name == 'schedule' && '--only-if-new-gw' || '' }}
      - name: Lagre resultat
        run: |
          git config user.name "fpl-bot"
          git config user.email "fpl-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Ny rapport" && git push)
